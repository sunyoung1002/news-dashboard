# 입법(계류 법안) 카테고리 분류 키워드 설정
#
# 이 파일은 GitHub 웹사이트에서 직접 열어 수정할 수 있습니다.
#
# collect_official_bills.py는 국회 전체 계류 법안을 다 가져온 뒤(검색 필터 없음),
# 법안명에 아래 키워드가 포함돼 있으면 그 카테고리로 분류합니다.
# 아래 bill_numbers에 적은 의안번호는 법안명과 관계없이 반드시 포함합니다.
#
# 형식: "법안명에 포함될 문구": "분류"
#
# 새 분류 규칙을 추가하려면 아래처럼 한 줄을 더 넣으면 됩니다:
#   "새 문구": "새 분류"

# 반드시 추적할 의안번호. 따옴표 안에 숫자만 적습니다.
bill_numbers:
  - "2221507"

