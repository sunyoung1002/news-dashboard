name: repair-bill-summaries

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-bills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 최신 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공식 첨부 원문의 주요내용 복원
        run: python apply_archived_summaries.py
      - name: 남은 누락 의안의 공개 원문 확인
        continue-on-error: true
        run: python restore_bill_summaries.py
      - name: 보완된 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in sample-bills.json assembly-21.json assembly-22.json summary-backfill-state.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Repair missing official bill summaries"
            git push
          fi

  publish:
    name: 갱신 자료를 대시보드에 배포
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 수집 후 최신 커밋 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Pages 설정 확인
        uses: actions/configure-pages@v5

      - name: 공개 정적 파일 준비
        run: |
          mkdir -p _site
          for file in *.html *.js *.css *.json; do
            if [ -f "$file" ]; then cp -- "$file" _site/; fi
          done
          for folder in assets images; do
            if [ -d "$folder" ]; then cp -R -- "$folder" _site/; fi
          done
          touch _site/.nojekyll

      - name: 배포 파일 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
