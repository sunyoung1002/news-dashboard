name: repair-bill-summaries

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-official-bills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 최신 저장소 가져오기
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 공식 첨부 원문의 주요내용 복원
        run: python apply_archived_summaries.py
      - name: 남은 누락 의안의 공개 원문 확인
        continue-on-error: true
        run: python restore_bill_summaries.py
      - name: 보완된 내용 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for file in sample-bills.json assembly-21.json assembly-22.json summary-backfill-state.json; do
            if [ -f "$file" ]; then git add -- "$file"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "Repair missing official bill summaries"
            git push
          fi
