name: deploy-dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: [update-official-bills, repair-bill-summaries, repair-receipts]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 최신 공개 자료 가져오기
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 공개 파일 준비 및 누락 검사
        run: python build_pages.py
      - name: 배포할 커밋과 용량 기록
        run: |
          echo '### 대시보드 배포' >> "$GITHUB_STEP_SUMMARY"
          echo "커밋: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          cat _site-size.txt >> "$GITHUB_STEP_SUMMARY"
          echo '배포가 시간 초과되면 코드 빌드 성공과 실제 사이트 배포 성공을 구분해 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
      - name: Pages 설정 확인
        uses: actions/configure-pages@v5
      - name: 공개 파일만 배포 자료로 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: GitHub Pages 배포
        id: deployment
        uses: actions/deploy-pages@v4
      - name: 실패 시 안내
        if: failure()
        run: |
          echo '### 배포 실패 확인' >> "$GITHUB_STEP_SUMMARY"
          echo 'Deploy to GitHub Pages 단계가 timeout이면 이 실행의 전체 로그를 내려받아 확인하세요. 자료 재수집이나 파일 재업로드로 해결된 것으로 간주하지 않습니다.' >> "$GITHUB_STEP_SUMMARY"
