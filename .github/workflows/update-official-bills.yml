name: update-official-bills

on:
  workflow_dispatch:
  schedule:
    # 매일 오전 6시 20분(한국시간) = 전날 21시 20분(UTC)
    - cron: "20 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-official-bills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 국회·법제처 공식 데이터 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          MOLEG_OC: ${{ secrets.MOLEG_OC }}
        run: python collect_official_bills.py

      - name: 결과를 GitHub에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample-bills.json
          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "Update official bill status"
            git push
          fi
