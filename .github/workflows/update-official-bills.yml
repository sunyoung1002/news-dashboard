name: update-official-bills

on:
  workflow_dispatch:
  schedule:
    # 한국시간 매일 오전 6시 30분 / 오후 3시
    - cron: "30 21 * * *"
    - cron: "0 6 * * *"

permissions:
  contents: write

concurrency:
  group: update-official-bills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 국회·법제처 공식 데이터 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          MOLEG_OC: ${{ secrets.MOLEG_OC }}
        run: python collect_official_bills.py

      - name: 기존·완료 법안 누계 병합
        run: python bill_archive.py

      - name: 결과를 GitHub에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample-bills.json bill_archive.csv
          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "Update official bill status and archive"
            git push
          fi
