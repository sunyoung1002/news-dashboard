name: update-official-bills

on:
  workflow_dispatch:
  schedule:
    # 한국(서울)시간 기준 매일 오전 06:30, 오후 15:00 실행
    - cron: "30 6 * * *"
      timezone: "Asia/Seoul"
    - cron: "0 15 * * *"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: update-official-bills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 국회·법제처 공식 데이터 수집
        env:
          ASSEMBLY_API_KEY: ${{ secrets.ASSEMBLY_API_KEY }}
          MOLEG_OC: ${{ secrets.MOLEG_OC }}
        run: python collect_official_bills.py

      - name: 한국시간 기준일 검증
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timedelta, timezone
          with open("sample-bills.json", encoding="utf-8") as f:
              data = json.load(f)
          today = datetime.now(timezone(timedelta(hours=9))).strftime("%Y-%m-%d")
          if not data.get("items"):
              raise SystemExit("수집 결과가 0건입니다.")
          if not str(data.get("updatedAt", "")).startswith(today):
              raise SystemExit(f"기준일 오류: {data.get('updatedAt')}")
          print(f"검증 완료: {len(data['items']):,}건 / {data['updatedAt']}")
          PY

      - name: 결과를 GitHub에 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample-bills.json
          if git diff --cached --quiet; then
            echo "변경사항이 없습니다."
          else
            git commit -m "Update official bill status (KST)"
            git pull --rebase origin main
            git push origin main
          fi
